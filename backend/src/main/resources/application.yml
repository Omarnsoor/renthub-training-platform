spring:
  application:
    name: renthub
  datasource:
    url: ${RENTHUB_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${RENTHUB_DB_USER:RENTHUB}
    password: ${RENTHUB_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${RENTHUB_PORT:8080}
